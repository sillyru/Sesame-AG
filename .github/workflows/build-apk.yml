name: Build Android APK
# 两种触发：手动点击运行 / 提交代码自动打包
on:
  workflow_dispatch: # 手动一键启动打包（最常用）
  push:
    branches: [main, master] # 提交代码自动构建

jobs:
  build:
    runs-on: ubuntu-latest # 云端ubuntu服务器编译
    steps:
      # 1.拉取源码
      - uses: actions/checkout@v4
      # 2.配置JDK17（新版Android必备）
      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # 3.赋予gradlew执行权限、编译Debug APK
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug
      # 4.打包APK上传到构建产物，打包后下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

